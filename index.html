<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1A2B">
<title>Photoelectric Effect</title>
<style>
:root{--bg:#0B1A2B;--ink:#EFE9DC;--muted:#8B98AA;--line:rgba(239,233,220,.15);--panel:rgba(255,255,255,.035);--g:#7FD4A8;--a:#E8B23A;
--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--bg);
 background-image:linear-gradient(rgba(239,233,220,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(239,233,220,.035) 1px,transparent 1px);
 background-size:32px 32px;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;
 display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
.hide{display:none!important}
body:not(.teacher) .tonly{display:none!important}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 8px;flex:none}
header h1{margin:0;font-size:1.15rem;font-weight:700}
header .sub{color:var(--muted);font-size:.82rem}
.hb{display:flex;gap:8px;flex:none}
.ob{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-size:.85rem}
.ob:hover{border-color:var(--muted)}
body.teacher #tBtn{border-color:var(--a);color:var(--a)}

/* stage */
#stage{flex:1;min-height:0;display:flex;gap:12px;padding:0 16px}
#view{flex:1;min-width:0;min-height:0;position:relative;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.18);overflow:hidden}
#app{position:absolute;inset:0;width:100%;height:100%;display:block}
.read{position:absolute;left:14px;top:10px;display:flex;gap:22px;font-family:var(--mono);pointer-events:none}
.read small{display:block;color:var(--muted);font-size:.7rem}
.read b{font-size:1.55rem;font-weight:600}
#rV{color:var(--a)} #rI{color:var(--g)}
.linfo{position:absolute;right:14px;top:12px;font-family:var(--mono);font-size:.78rem;color:var(--muted);text-align:right;pointer-events:none}
#noEm{color:var(--a)}
#msg{position:absolute;left:14px;right:14px;bottom:10px;font-size:.85rem;min-height:1.2em;pointer-events:none}
#msg.ok{color:var(--g)} #msg.warn{color:var(--a)}
#side{width:330px;flex:none;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.box{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px}
.box h3{margin:0 0 6px;font-size:.78rem;font-family:var(--mono);color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.tbl{flex:1 1 auto;min-height:130px;overflow:auto}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.8rem}
th,td{padding:4px 3px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;position:sticky;top:0;background:#0d1e31}
td input{width:66px;font:inherit;padding:3px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);text-align:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.inl{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.82rem;flex-wrap:wrap}
.inl input{width:86px;font:inherit;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink)}
#uRes{font-family:var(--mono);font-size:.85rem;color:var(--g);margin-top:6px;min-height:1.2em}
canvas.plot{width:100%;height:210px;display:block}
.res{font-family:var(--mono);font-size:.78rem;margin-top:6px;line-height:1.55}
.ans{color:var(--g)}

/* controls */
.ctl{flex:none;padding:8px 16px 0;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{border-color:var(--g);color:var(--g)}
.chip.part.on{border-color:var(--a);color:var(--a)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.sep{flex:none;width:1px;height:20px;background:var(--line);margin:0 3px}
.vrow{display:flex;align-items:center;gap:6px}
.vrow input[type=range]{flex:1;min-width:80px;accent-color:#E8B23A}
.vrow .lab{font-family:var(--mono);color:var(--muted);font-size:.85rem}

/* bottom bar */
footer{flex:none;padding:8px 16px calc(6px + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;gap:8px}
.act{border:1.5px solid var(--g);background:rgba(127,212,168,.12);color:var(--g);border-radius:10px;padding:8px 16px;font-weight:600}
.ic{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-family:var(--mono)}
.sp{flex:1}
.credit{color:var(--muted);font-size:.72rem;text-align:center;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (orientation:portrait),(max-width:760px){#stage{flex-direction:column}#side{width:auto;flex:0 0 38%}}

/* modals */
.modal{position:fixed;inset:0;background:rgba(5,10,18,.75);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.mbox{background:#102338;border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:520px}
.mbox h2{margin:0 0 10px;font-size:1rem}
.mbox h4{margin:12px 0 4px;font-size:.88rem;color:var(--a)}
.mbox .sec{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.mbox label{display:block;font-size:.8rem;color:var(--muted);margin:8px 0 3px}
.mbox input[type=password],.mbox input[type=text],.mbox input[type=email]{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.mbox .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mbox ol{padding-left:20px;margin:4px 0;font-size:.9rem;line-height:1.55}
.mbox p{font-size:.9rem;line-height:1.55;margin:4px 0}
.note{font-size:.82rem;min-height:1.2em;margin-top:6px}
.note.ok{color:var(--g)} .note.warn{color:var(--a)}
.chk{display:flex;align-items:center;gap:8px;font-size:.88rem;margin:8px 0}

/* worksheet */
#wsWrap{position:fixed;inset:0;background:#fff;color:#111;z-index:60;overflow:auto;padding:16px}
#wsWrap .tb{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
#wsWrap .tb button{border:1px solid #888;background:#f3f3f3;color:#111;border-radius:8px;padding:6px 14px}
.ws{max-width:820px;margin:0 auto;font-size:.95rem;line-height:1.5}
.ws h2{text-align:center;font-size:1.25rem}
.ws h3{font-size:1rem;margin:18px 0 6px;border-bottom:2px solid #2b6cb0;padding-bottom:2px}
.ws .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:8px 0}
.ws .blank{display:inline-block;min-width:140px;border-bottom:1px dotted #111}
.ws table{font-family:inherit;font-size:.9rem}
.ws th,.ws td{border:1px solid #111;position:static;background:#fff;color:#111;height:28px}
.grid{height:300px;border:1px solid #111;margin:6px 0;background-color:#fff;
 background-image:linear-gradient(#cfd8e3 1px,transparent 1px),linear-gradient(90deg,#cfd8e3 1px,transparent 1px);background-size:20px 20px;
 -webkit-print-color-adjust:exact;print-color-adjust:exact}
.lines div{border-bottom:1px dotted #111;height:30px}
.ws .credit{color:#555;white-space:normal}
@media print{
 html,body{height:auto;overflow:visible;background:#fff;display:block}
 body>*:not(#wsWrap){display:none!important}
 #wsWrap{position:static;overflow:visible;padding:0}
 #wsWrap .tb{display:none}
 .ws h3{break-after:avoid}.grid,.ws table{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
  <div class="hb"><button class="ob" id="langBtn"></button><button class="ob" id="tBtn"></button></div>
</header>

<div id="stage">

    <div class="read">
      <div><small>V</small><b id="rV">+0.00</b> V</div>

    <div class="linfo"><div id="noEm"></div></div>
    <div id="msg"></div>

  <div id="side">

    <div class="box tonly" id="g1">

    <!-- Part 2 -->
    <div class="box" id="u2">

      <div id="uRes"></div>
    </div>
    <div class="box tonly" id="g2">
      <canvas class="plot" id="plot2"></canvas>
      <div class="res" id="results"></div>
      <div class="res ans" id="a2"></div>
    </div>
  </div>
</div>

<div class="ctl">
  <div class="chips" id="chips"></div>
  <div class="vrow">
    <span class="lab">V</span>
    <input type="range" id="vs" min="-3" max="3" step="0.01" value="0">
    <button class="chip mono" data-dv="-0.1">−0.1</button>
    <button class="chip mono" data-dv="-0.01">−0.01</button>
    <button class="chip mono" data-dv="0.01">+0.01</button>
    <button class="chip mono" data-dv="0.1">+0.1</button>
    <button class="chip mono" id="v0">0</button>
  </div>
</div>

<footer>
  <div class="bar">
    <button class="act" id="bRec"></button>
    <button class="ic" id="bSweep"></button>
    <button class="ic" id="bClr" title="clear">↺</button>
    <span class="sp"></span>
    <button class="ic" id="bCsv" title="CSV">⤓ CSV</button>
  </div>
  <div class="credit" id="credit"></div>
</footer>

<!-- help -->
<div class="modal hide" id="hModal"><div class="mbox">
  <h2 id="hT"></h2><div id="hBody"></div>
  <div class="row"><button class="ob" data-close></button></div>
</div></div>

<!-- teacher -->
<div class="modal hide" id="tModal"><div class="mbox">
  <h2 id="tT"></h2>
  <div id="tLogin">
    <label id="lPw"></label>
    <input type="password" id="pw" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row"><button class="act" id="pwOk"></button><button class="ob" data-close></button></div>
    <div class="note warn" id="pwMsg"></div>
    <div class="sec">
      <button class="ob" id="chTog"></button>
      <div id="chBox" class="hide">
        <label id="lEm"></label><input type="email" id="em" autocapitalize="off" autocorrect="off" spellcheck="false">
        <label id="lAc"></label><input type="password" id="ac" autocapitalize="off" autocorrect="off" spellcheck="false">
        <label id="lN1"></label><input type="password" id="n1" autocapitalize="off" autocorrect="off" spellcheck="false">
        <label id="lN2"></label><input type="password" id="n2" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="row"><button class="act" id="chSave"></button><button class="ob" id="chReset"></button></div>
        <div class="note" id="chMsg"></div>
      </div>
    </div>
  </div>
  <div id="tPanel" class="hide">
    <div class="note warn" id="lockNote"></div>
    <label id="lCath"></label>
    <div class="chips" id="metalTiles" style="flex-wrap:wrap"></div>
    <div class="chk"><input type="checkbox" id="err"><span id="lErr"></span></div>
    <div class="chk"><input type="checkbox" id="showG"><span id="lShow"></span></div>
    <div class="mono ans" id="tPhi"></div>
    <div class="sec">
      <b id="lLink"></b>
      <div class="note" id="lLinkN" style="color:var(--muted)"></div>
      <div class="row"><button class="act" id="mkLink"></button></div>
      <input type="text" id="linkOut" readonly style="margin-top:8px">
      <div class="note" id="linkMsg"></div>
    </div>
    <div class="sec"><button class="act" id="openWS"></button></div>
    <div class="sec row"><button class="ob" data-close></button><button class="ob" id="tOff"></button></div>
  </div>
</div></div>

<!-- worksheet -->
<div id="wsWrap" class="hide">
  <div class="tb"><button id="wsPrint"></button><button id="wsClose"></button></div>
  <div class="ws" id="ws"></div>
</div>

(function(){const k=new URLSearchParams(location.search).get('k');if(!k||k.length<12)return;
 const c=parseInt(k.slice(-2),36);if(isNaN(c))return;const m=c%8,e=Math.floor(c/8)%2;
 if(m<METALS.length){LOCK={metal:m,err:!!e};S.metal=m;S.err=!!e;}})();

/* ---------- physics ---------- */
const photonEV=lam=>H*C/(lam*1e-9)/QE;
const freq14=lam=>C/(lam*1e-9)/1e14;
function effVs(i){let v=photonEV(FILTERS[i].lam)-METALS[S.metal].phi;if(v<=0)return 0;if(S.err)v=Math.max(0.01,v+S.off[i]);return v;}
function isat(i,lv){const q=0.35+0.65*(700-FILTERS[i].lam)/295;return 150*LEVELS[lv]*q;}
function current(V,i,lv){const vs=effVs(i);if(vs<=0||V<=-vs)return 0;const Is=isat(i,lv);let g;
 if(V<=0){const u=(V+vs)/vs;g=0.5*u*u;}else g=1-0.5*Math.exp(-2*V/vs);return Is*g;}
function reading(V){let I=current(V,S.filter,S.level);if(S.err&&I>0)I*=1+(Math.random()-0.5)*0.01;return I;}

 h+='<span class="sep"></span>'+[0,1,2].map(i=>`<button class="chip mono ${i===S.level?'on':''}" data-l="${i}">${LV[i]}</button>`).join('');
 h+='<span class="sep"></span><button class="chip mono" data-help="1">?</button>';

/* record / sweep / clear */
function checkColor1(){
 const has=S.p1.some(a=>a.length);
 if(has&&S.p1color!==null&&S.p1color!==S.filter){if(!confirm(t('colorChanged')))return false;S.p1=[[],[],[]];}
 S.p1color=S.filter;return true;
}
function addPoint(lv,V,I){const a=S.p1[lv];const k=a.findIndex(p=>Math.abs(p[0]-V)<0.001);if(k>=0)a[k]=[V,I];else a.push([V,I]);a.sort((x,y)=>x[0]-y[0]);}
$('bRec').onclick=()=>{
 if(S.part===1){if(!checkColor1())return;addPoint(S.level,S.V,+reading(S.V).toFixed(2));msg(t('recordedAt')(LV[S.level]),'ok');updateAll();return;}
 if(S.V>0){msg(t('posV'),'warn');return;}
 const I=reading(S.V);
 if(I>=0.005){msg(t('notZero'),'warn');return;}
 if(S.V===0){S.vs[S.filter]='0.00';msg(t('noEmitRec')(cname(S.filter)),'warn');}
 else{S.vs[S.filter]=(-S.V).toFixed(2);
  if(current(S.V+0.03,S.filter,S.level)<0.005)msg(t('overshoot'),'warn');
  else msg(t('recorded')(cname(S.filter),(-S.V).toFixed(2)),'ok');}
 updateAll();
};
$('bSweep').onclick=()=>{if(!checkColor1())return;S.p1[S.level]=[];for(let v=-3;v<=3.0001;v+=0.2){const V=+v.toFixed(2);addPoint(S.level,V,+reading(V).toFixed(2));}msg(t('recordedAt')(LV[S.level]),'ok');updateAll();};
$('bClr').onclick=()=>{
 if(S.part===1){S.p1=[[],[],[]];S.p1color=null;}else{S.vs=S.vs.map(()=>'');}
 msg('');updateAll();
};

/* ---------- plotting ---------- */
function nice(range,n){const raw=range/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return(f<1.5?1:f<3?2:f<7?5:10)*p;}
function plot(cv,o){
 const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w)return;
 cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
 const ink='#EFE9DC',muted='#8B98AA',line='rgba(239,233,220,.12)';
 const L=46,R=8,Tp=8,B=34,pw=w-L-R,ph=h-Tp-B;
 const X=x=>L+(x-o.xmin)/(o.xmax-o.xmin)*pw,Y=y=>Tp+(o.ymax-y)/(o.ymax-o.ymin)*ph;
 g.font='10px ui-monospace,Menlo,Consolas,monospace';g.lineWidth=1;
 const sx=nice(o.xmax-o.xmin,6),sy=nice(o.ymax-o.ymin,5);
 g.textAlign='center';g.textBaseline='top';
 for(let x=Math.ceil(o.xmin/sx)*sx;x<=o.xmax+1e-9;x+=sx){g.strokeStyle=line;g.beginPath();g.moveTo(X(x),Tp);g.lineTo(X(x),Tp+ph);g.stroke();g.fillStyle=muted;g.fillText(+x.toFixed(3),X(x),Tp+ph+3);}
 g.textAlign='right';g.textBaseline='middle';
 for(let y=Math.ceil(o.ymin/sy)*sy;y<=o.ymax+1e-9;y+=sy){g.strokeStyle=line;g.beginPath();g.moveTo(L,Y(y));g.lineTo(L+pw,Y(y));g.stroke();g.fillStyle=muted;g.fillText(+y.toFixed(3),L-4,Y(y));}
 g.strokeStyle=muted;g.lineWidth=1.2;
 if(o.xmin<=0&&o.xmax>=0){g.beginPath();g.moveTo(X(0),Tp);g.lineTo(X(0),Tp+ph);g.stroke();}
 if(o.ymin<=0&&o.ymax>=0){g.beginPath();g.moveTo(L,Y(0));g.lineTo(L+pw,Y(0));g.stroke();}
 g.fillStyle=ink;g.textAlign='center';g.textBaseline='bottom';g.fillText(o.xl,L+pw/2,h-1);
 g.save();g.translate(10,Tp+ph/2);g.rotate(-Math.PI/2);g.textBaseline='middle';g.fillText(o.yl,0,0);g.restore();
 g.save();g.beginPath();g.rect(L,Tp,pw,ph);g.clip();
 o.series.forEach(s=>{
  if(s.line&&s.pts.length>1){g.strokeStyle=s.color;g.lineWidth=2;g.setLineDash(s.dash||[]);g.beginPath();s.pts.forEach((p,k)=>k?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.stroke();g.setLineDash([]);}
  if(s.dots)s.pts.forEach(p=>{g.fillStyle=p[2]||s.color;g.beginPath();g.arc(X(p[0]),Y(p[1]),s.r||3,0,7);g.fill();});
 });
 g.restore();
}
function drawP1(){
 if(!(teacher&&S.show&&S.part===1))return;
 const all=S.p1.flat();let ymax=10;all.forEach(p=>ymax=Math.max(ymax,p[1]*1.1));
 plot($('plot1'),{xmin:-3,xmax:3,ymin:0,ymax,xl:t('xI'),yl:t('yI'),
  series:S.p1.map((a,i)=>({pts:a,color:LCOL[i],line:true,dots:a.length<70,r:2.5}))});
 $('a1').innerHTML=LV.map((l,i)=>`<span style="color:${LCOL[i]}">● ${l}</span>`).join('  ');
}
function fit(){
 const pts=[];FILTERS.forEach((f,i)=>{const v=parseFloat(S.vs[i]);if(isFinite(v)&&v>0)pts.push([freq14(f.lam),v,f.col]);});
 if(pts.length<2)return{pts};
 const n=pts.length;let sx=0,sy=0,sxx=0,sxy=0,syy=0;pts.forEach(p=>{sx+=p[0];sy+=p[1];sxx+=p[0]*p[0];sxy+=p[0]*p[1];syy+=p[1]*p[1];});
 const den=n*sxx-sx*sx;if(!den)return{pts};
 const m=(n*sxy-sx*sy)/den,b=(sy-m*sx)/n;
 const r=(n*sxy-sx*sy)/Math.sqrt(den*(n*syy-sy*sy));
 return{pts,m,b,r2:r*r};
}
function drawP2(){
 if(!(teacher&&S.show&&S.part===2))return;
 const F=fit();let ymax=1,ymin=0;F.pts.forEach(p=>ymax=Math.max(ymax,p[1]+0.3));
 const series=[{pts:F.pts,color:'#EFE9DC',dots:true,r:5}];
 const zeros=S.vs.some(v=>parseFloat(v)===0);
 if(F.m!==undefined){
  ymin=Math.min(0,F.b)-0.2;const f0=-F.b/F.m;
  series.unshift({pts:[[0,F.b],[Math.max(0,f0),Math.max(0,f0)*F.m+F.b]],color:'#8B98AA',line:true,dash:[5,4]});
  series.unshift({pts:[[Math.max(0,f0),Math.max(0,f0)*F.m+F.b],[8,8*F.m+F.b]],color:'#7FD4A8',line:true});
  const h=F.m/1e14*QE,phi=-F.b,err=Math.abs(h-H)/H*100;
  $('results').innerHTML=`<div><b>${t('hval')} = ${(h/1e-34).toFixed(3)} × 10⁻³⁴ J·s</b></div>
   <div>${t('f0')} = ${f0.toFixed(2)} × 10¹⁴ Hz</div><div>${t('phi')} = ${phi.toFixed(2)} eV</div>
   <div>${t('errp')} = ${err.toFixed(2)} %</div><div>${t('r2')} = ${F.r2.toFixed(4)}</div>${zeros?`<div style="color:#8B98AA">${t('excluded')}</div>`:''}`;
 }else $('results').textContent=t('need2');
 plot($('plot2'),{xmin:0,xmax:8,ymin,ymax,xl:t('xF'),yl:t('yF'),series});
 $('a2').textContent=t('a2')(METALS[S.metal].phi);
}

/* ---------- apparatus animation ---------- */
let electrons=[],last=performance.now(),spawnAcc=0;
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
const CX=340,CY=110,CR=55,AX=500;
function cathX(y){return CX-Math.sqrt(Math.max(0,CR*CR-(y-CY)*(y-CY)));}
function frame(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 const cv=$('app'),dpr=window.devicePixelRatio||1,w=cv.clientWidth,hh=cv.clientHeight;
 if(w&&hh){
  const W=Math.round(w*dpr),Hh=Math.round(hh*dpr);if(cv.width!==W||cv.height!==Hh){cv.width=W;cv.height=Hh;}
  const g=cv.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,Hh);
  const top=58,bot=30,sc=Math.max(0.2,Math.min(w/600,(hh-top-bot)/300)),ox=(w-600*sc)/2,oy=top+Math.max(0,(hh-top-bot)-300*sc)/2;
  g.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);
  const ink='#EFE9DC',muted='#8B98AA',f=FILTERS[S.filter],al=[0.2,0.35,0.55][S.level];
  // beams
  g.fillStyle=`rgba(255,240,190,${al})`;g.beginPath();g.moveTo(62,100);g.lineTo(128,82);g.lineTo(128,138);g.lineTo(62,120);g.fill();
  g.fillStyle=hexA(f.col,al+0.1);g.beginPath();g.moveTo(140,82);g.lineTo(292,62);g.lineTo(292,158);g.lineTo(140,138);g.fill();
  // lamp
  const rg=g.createRadialGradient(48,110,2,48,110,26);rg.addColorStop(0,'#fff9db');rg.addColorStop(1,'rgba(255,212,59,0.1)');
  g.fillStyle=rg;g.beginPath();g.arc(48,110,26,0,7);g.fill();g.strokeStyle=muted;g.lineWidth=2;g.beginPath();g.arc(48,110,16,0,7);g.stroke();
  // filter
  g.fillStyle=f.col;g.fillRect(128,72,12,76);
  // tube
  g.strokeStyle=muted;g.lineWidth=2;g.fillStyle='rgba(140,170,255,0.07)';
  g.beginPath();if(g.roundRect)g.roundRect(240,35,300,150,45);else g.rect(240,35,300,150);g.fill();g.stroke();
  // cathode & anode
  g.strokeStyle='#9aa4b0';g.lineWidth=7;g.beginPath();g.arc(CX,CY,CR,Math.PI-0.95,Math.PI+0.95);g.stroke();
  g.strokeStyle='#c3cad3';g.lineWidth=5;g.beginPath();g.moveTo(AX,65);g.lineTo(AX,155);g.stroke();
  // wires & supply
  g.strokeStyle='rgba(239,233,220,.6)';g.lineWidth=1.5;g.beginPath();g.moveTo(cathX(155),155);g.lineTo(cathX(155),265);g.lineTo(350,265);g.moveTo(AX,155);g.lineTo(AX,265);g.lineTo(430,265);g.stroke();
  g.fillStyle='#0B1A2B';g.strokeStyle=ink;g.lineWidth=1.2;g.fillRect(345,246,90,38);g.strokeRect(345,246,90,38);
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=muted;g.font='10px ui-monospace,Menlo,Consolas,monospace';g.fillText(t('supply'),390,256);
  g.fillStyle='#E8B23A';g.font='bold 13px ui-monospace,Menlo,Consolas,monospace';g.fillText((S.V<0?'−':'+')+Math.abs(S.V).toFixed(2)+' V',390,272);
  g.fillStyle=muted;g.font='11px ui-monospace,Menlo,Consolas,monospace';
  g.fillText(t('cath')+(S.V<0?' (+)':' (−)'),cathX(155)-14,205);g.fillText(t('anode')+(S.V<0?' (−)':' (+)'),AX+8,205);
  g.fillText(t('lamp'),48,150);
  // electrons
  const vs=effVs(S.filter);
  if(vs>0){spawnAcc+=dt*70*isat(S.filter,S.level)/150;
   while(spawnAcc>=1&&electrons.length<350){spawnAcc--;const y=CY+(Math.random()*2-1)*42;electrons.push({y,s:0,k:vs*Math.random(),d:1});}
  }else spawnAcc=0;
  g.fillStyle='#7FD4A8';
  electrons=electrons.filter(e=>{
   const KE=e.k+S.V*e.s;
   if(e.d>0&&KE<=0)e.d=-1;
   e.s+=e.d*(0.05+0.55*Math.sqrt(Math.max(KE,0)))*dt;
   if(e.s<0||e.s>1)return false;
   const x0=cathX(e.y)+4,x=x0+e.s*(AX-3-x0);
   g.beginPath();g.arc(x,e.y,2.6,0,7);g.fill();return true;
  });
 }
 requestAnimationFrame(frame);
}
setInterval(()=>{if(S.err)updateMeters();},300);
window.addEventListener('resize',()=>{drawP1();drawP2();});

/* ---------- CSV ---------- */
$('bCsv').onclick=()=>{
 let s='Part 1,filter,'+(S.p1color!==null?FILTERS[S.p1color].id:'')+'\nintensity,V (V),I (nA)\n';
 S.p1.forEach((a,i)=>a.forEach(p=>s+=`${['I1','2I1','3I1'][i]},${p[0]},${p[1]}\n`));
 s+='\nPart 2\ncolor,lambda (nm),f (1e14 Hz),Vs (V)\n';
 FILTERS.forEach((f,i)=>s+=`${f.id},${f.lam},${freq14(f.lam).toFixed(3)},${S.vs[i]}\n`);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download='photoelectric-data.csv';a.click();
};

build();requestAnimationFrame(frame);
</script>
